<!--
  Mirror the font loading from `index.html` so stories use the same
  Funnel Sans / Geist / Inter stack the app does. Storybook serves its
  own iframe HTML and won't pick up `index.html` automatically.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500;600;700;800&family=Geist:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
